<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title description">
  <title id="title">Arquitectura de Coworking Workshop</title>
  <desc id="description">Orders service consulta Catalog service por HTTP dentro de una red Docker compartida.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #172033; }
    .service { fill: #f1f6ff; stroke: #315a9b; stroke-width: 2; rx: 12; }
    .network { fill: #f7f7f8; stroke: #777; stroke-width: 2; rx: 16; }
    .title { font-size: 22px; font-weight: bold; }
    .label { font-size: 18px; }
    .small { font-size: 15px; fill: #4b5563; }
    .arrow { stroke: #303b4f; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#303b4f" />
    </marker>
  </defs>
  <text x="60" y="52" class="title">Coworking Workshop - arquitectura</text>
  <rect x="70" y="100" width="310" height="145" class="service" />
  <text x="225" y="150" text-anchor="middle" class="title">catalog-service</text>
  <text x="225" y="185" text-anchor="middle" class="label">FastAPI :8001</text>
  <text x="225" y="215" text-anchor="middle" class="small">/spaces · /health</text>
  <rect x="520" y="100" width="310" height="145" class="service" />
  <text x="675" y="150" text-anchor="middle" class="title">orders-service</text>
  <text x="675" y="185" text-anchor="middle" class="label">FastAPI :8002</text>
  <text x="675" y="215" text-anchor="middle" class="small">/orders · /health</text>
  <path d="M 515 170 L 390 170" class="arrow" />
  <text x="452" y="155" text-anchor="middle" class="small">HTTP</text>
  <rect x="110" y="290" width="680" height="90" class="network" />
  <text x="450" y="328" text-anchor="middle" class="title">Docker network: coworking-network</text>
  <text x="450" y="357" text-anchor="middle" class="small">DNS interno: http://catalog-service:8001</text>
  <path d="M 225 245 L 225 280" stroke="#777" stroke-width="2" />
  <path d="M 675 245 L 675 280" stroke="#777" stroke-width="2" />
</svg>
