name: coworking

services:
  # Emulador local gratuito de AWS (Lambda, API Gateway, EventBridge, SQS)
  localstack:
    image: localstack/localstack:latest
    container_name: localstack-coworking
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      - LOCALSTACK_AUTH_TOKEN=ls-tOwIKiwa-cIju-LecA-9701-VOrU71554634
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - coworking-network

  # Servicio de órdenes en FastAPI
  orders-service:
    build:
      context: ./orders-service
    container_name: orders-service
    ports:
      - "8002:8002"
    environment:
      - CATALOG_SERVICE_URL=http://localstack:4566
    networks:
      - coworking-network

networks:
  coworking-network:
    driver: bridge
