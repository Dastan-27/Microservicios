AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Microservicios Serverless Event-Driven (API Gateway -> Lambda Catalog
  -> EventBridge -> SQS -> Lambda Consumer -> Orders)
Globals:
  Function:
    Timeout: 15
    Runtime: python3.11
    MemorySize: 128
    Environment:
      Variables:
        EVENT_BUS_NAME: default
Resources:
  CatalogEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: catalog-events
  CatalogEventsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
      - Ref: CatalogEventsQueue
      PolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service: events.amazonaws.com
          Action: sqs:SendMessage
          Resource:
            Fn::GetAtt:
            - CatalogEventsQueue
            - Arn
  CatalogSpaceChangedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: catalog-space-changed-rule
      Description: Enruta eventos SpaceChanged a la cola SQS catalog-events
      EventPattern:
        source:
        - coworking.catalog
        detail-type:
        - SpaceChanged
      Targets:
      - Arn:
          Fn::GetAtt:
          - CatalogEventsQueue
          - Arn
        Id: CatalogEventsQueueTarget
  CatalogFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: catalog-fn
      CodeUri: CatalogFunction
      Handler: handler.lambda_handler
      Policies:
      - EventBridgePutEventsPolicy:
          EventBusName: default
      Events:
        GetCatalog:
          Type: Api
          Properties:
            Path: /catalog
            Method: get
        GetCatalogById:
          Type: Api
          Properties:
            Path: /catalog/{id}
            Method: get
        PostAvailability:
          Type: Api
          Properties:
            Path: /catalog/{id}/availability
            Method: post
        GetSpaces:
          Type: Api
          Properties:
            Path: /spaces
            Method: get
        GetSpaceById:
          Type: Api
          Properties:
            Path: /spaces/{id}
            Method: get
        PostSpaceAvailability:
          Type: Api
          Properties:
            Path: /spaces/{id}/availability
            Method: post
    Metadata:
      SamResourceId: CatalogFunction
  ConsumerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: consumer-fn
      CodeUri: ConsumerFunction
      Handler: handler.lambda_handler
      Environment:
        Variables:
          ORDERS_SERVICE_URL: http://host.docker.internal:8002
      Policies:
      - SQSPollerPolicy:
          QueueName: catalog-events
      Events:
        CatalogEventsQueueTrigger:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt:
              - CatalogEventsQueue
              - Arn
            BatchSize: 10
    Metadata:
      SamResourceId: ConsumerFunction
Outputs:
  CatalogApi:
    Description: Endpoint URL de API Gateway
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/catalog
  CatalogEventsQueueUrl:
    Description: URL de la cola SQS
    Value:
      Ref: CatalogEventsQueue
  CatalogEventsQueueArn:
    Description: ARN de la cola SQS
    Value:
      Fn::GetAtt:
      - CatalogEventsQueue
      - Arn
