services:
  # Servicio 1: Catálogo de espacios de coworking
  - type: web
    name: catalog-service
    runtime: docker
    dockerfilePath: ./catalog-service/Dockerfile
    dockerContext: ./catalog-service
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8001

  # Servicio 2: Gestión de órdenes
  - type: web
    name: orders-service
    runtime: docker
    dockerfilePath: ./orders-service/Dockerfile
    dockerContext: ./orders-service
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8002
      - key: CATALOG_TIMEOUT_SECONDS
        value: 10.0
      - key: CATALOG_SERVICE_URL
        fromService:
          type: web
          name: catalog-service
          envVarKey: RENDER_EXTERNAL_HOSTNAME
