AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Microservicios Serverless Event-Driven (API Gateway -> Lambda Catalog -> EventBridge -> SQS -> Lambda Consumer -> Orders)

Globals:
  Function:
    Timeout: 15
    Runtime: python3.11
    MemorySize: 128
    Environment:
      Variables:
        EVENT_BUS_NAME: default

Resources:
  # 1. Cola SQS para recibir y desacoplar los eventos del catálogo
  CatalogEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: catalog-events

  # 2. Política de SQS para autorizar a EventBridge a enviar mensajes
  CatalogEventsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref CatalogEventsQueue
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt CatalogEventsQueue.Arn

  # 3. Regla en EventBridge que filtra eventos 'SpaceChanged'
  CatalogSpaceChangedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: catalog-space-changed-rule
      Description: Enruta eventos SpaceChanged a la cola SQS catalog-events
      EventPattern:
        source:
          - "coworking.catalog"
        detail-type:
          - "SpaceChanged"
      Targets:
        - Arn: !GetAtt CatalogEventsQueue.Arn
          Id: "CatalogEventsQueueTarget"

  # 4. LAB 6: Lambda catalog-service con API Gateway
  CatalogFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: catalog-fn
      CodeUri: lambda-catalog/
      Handler: handler.lambda_handler
      Policies:
        - EventBridgePutEventsPolicy:
            EventBusName: default
      Events:
        GetCatalog:
          Type: Api
          Properties:
            Path: /catalog
            Method: get
        GetCatalogById:
          Type: Api
          Properties:
            Path: /catalog/{id}
            Method: get
        PostAvailability:
          Type: Api
          Properties:
            Path: /catalog/{id}/availability
            Method: post
        GetSpaces:
          Type: Api
          Properties:
            Path: /spaces
            Method: get
        GetSpaceById:
          Type: Api
          Properties:
            Path: /spaces/{id}
            Method: get
        PostSpaceAvailability:
          Type: Api
          Properties:
            Path: /spaces/{id}/availability
            Method: post

  # 5. LAB 7: Consumer Lambda que procesa eventos desde SQS
  ConsumerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: consumer-fn
      CodeUri: lambda-consumer/
      Handler: handler.lambda_handler
      Environment:
        Variables:
          ORDERS_SERVICE_URL: http://host.docker.internal:8002
      Policies:
        - SQSPollerPolicy:
            QueueName: catalog-events
      Events:
        CatalogEventsQueueTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt CatalogEventsQueue.Arn
            BatchSize: 10

Outputs:
  CatalogApi:
    Description: "Endpoint URL de API Gateway"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/catalog"
  CatalogEventsQueueUrl:
    Description: "URL de la cola SQS"
    Value: !Ref CatalogEventsQueue
  CatalogEventsQueueArn:
    Description: "ARN de la cola SQS"
    Value: !GetAtt CatalogEventsQueue.Arn
